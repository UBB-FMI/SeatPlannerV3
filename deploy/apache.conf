# Add inside your existing HTTPS virtual host. The backend is plain HTTP.
# Enable modules: proxy proxy_http headers (and ssl on the TLS terminator).
ProxyPreserveHost On
ProxyAddHeaders Off
# Overwrite, do NOT append or retain a client-supplied X-Real-IP.
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
RequestHeader set X-Forwarded-Proto "https"
LimitRequestBody 20971520

# ROOT DEPLOYMENT: PUBLIC_URL=https://seats.example.org
ProxyPass        / http://127.0.0.1:8000/ connectiontimeout=5 timeout=90
ProxyPassReverse / http://127.0.0.1:8000/

# SUBPATH DEPLOYMENT: instead of the two lines above, use:
# PUBLIC_URL=https://faculty.example.org/seats
# RedirectMatch 308 ^/seats$ /seats/
# ProxyPass        /seats/ http://127.0.0.1:8000/seats/ connectiontimeout=5 timeout=90
# ProxyPassReverse /seats/ http://127.0.0.1:8000/seats/
# Keep the prefix upstream. Put these rules before any catch-all ProxyPass / rule.
# The proxy connection's exact IP/CIDR goes in TRUSTED_PROXY_CIDRS for IP throttling.
# Do not use a blanket trusted-proxy range on an externally reachable backend.
